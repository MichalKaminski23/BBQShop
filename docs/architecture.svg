<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Architektura BBQShop</title>
  <desc>Warstwy repozytorium BBQShop: frontend React, FastAPI, moduły podatności, pakiety współdzielone i bazy danych.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Frontend -->
  <rect x="190" y="40" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="340" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Frontend — React + Vite</text>
  <text x="340" y="84" text-anchor="middle" font-size="12" fill="#444441">Moduły · Sklep · Logowanie</text>

  <text x="355" y="122" font-size="12" fill="#73726c">proxy /api</text>
  <line x1="340" y1="96" x2="340" y2="140" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API -->
  <rect x="190" y="140" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="340" y="166" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">bbq_api — FastAPI</text>
  <text x="340" y="184" text-anchor="middle" font-size="12" fill="#3C3489">Rejestr modułów · /health · /modules</text>

  <text x="355" y="227" font-size="12" fill="#73726c">montuje wg .env</text>
  <line x1="340" y1="196" x2="340" y2="250" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Modules container -->
  <rect x="40" y="250" width="600" height="112" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 5"/>
  <text x="58" y="276" font-size="14" font-weight="500" fill="#2C2C2A">Moduły podatności</text>
  <text x="210" y="276" font-size="12" fill="#73726c">wariant z .env: vulnerable · secure · off</text>

  <rect x="58" y="288" width="182" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="149" y="314" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">bbq_sqli</text>
  <text x="149" y="332" text-anchor="middle" font-size="12" fill="#0F6E56">/products/search</text>

  <rect x="249" y="288" width="182" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="340" y="314" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">bbq_nosqli</text>
  <text x="340" y="332" text-anchor="middle" font-size="12" fill="#0F6E56">/login</text>

  <rect x="440" y="288" width="182" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75" stroke-dasharray="5 5"/>
  <text x="531" y="314" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">+ 7 modułów</text>
  <text x="531" y="332" text-anchor="middle" font-size="12" fill="#5F5E5A">w planie</text>

  <line x1="220" y1="362" x2="195" y2="406" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="362" x2="490" y2="406" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Shared packages -->
  <rect x="70" y="406" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="190" y="432" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">bbq_core</text>
  <text x="190" y="450" text-anchor="middle" font-size="12" fill="#3C3489">Konfiguracja · kontrakt modułu</text>

  <rect x="370" y="406" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="490" y="432" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">bbq_db</text>
  <text x="490" y="450" text-anchor="middle" font-size="12" fill="#3C3489">Modele · migracje · seed</text>

  <line x1="440" y1="462" x2="400" y2="508" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="462" x2="560" y2="508" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Databases -->
  <rect x="330" y="508" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="400" y="534" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">PostgreSQL</text>
  <text x="400" y="552" text-anchor="middle" font-size="12" fill="#185FA5">SQLi · sklep</text>

  <rect x="490" y="508" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="560" y="534" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">MongoDB</text>
  <text x="560" y="552" text-anchor="middle" font-size="12" fill="#185FA5">NoSQLi · users</text>

  <!-- Legend -->
  <rect x="40" y="592" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="60" y="603" font-size="12" fill="#73726c">gotowe</text>
  <rect x="150" y="592" width="14" height="14" rx="3" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="170" y="603" font-size="12" fill="#73726c">w planie</text>
  <rect x="270" y="592" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="290" y="603" font-size="12" fill="#73726c">pakiety backendu (Python)</text>
</svg>
