[project]
name = "bbq-db"
version = "0.1.0"
description = "Baza danych BBQShop: modele, migracje i dane przykładowe."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "bbq-core",
]

[tool.uv.sources]
bbq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbq_db"]
