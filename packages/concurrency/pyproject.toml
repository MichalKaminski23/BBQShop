[project]
name = "bbq-concurrency"
version = "0.1.0"
description = "Moduł BBQShop: nieograniczona współbieżność i wielokrotne wykonanie operacji."
requires-python = ">=3.13"
dependencies = ["bbq-core", "bbq-db"]

[project.entry-points."bbqshop.modules"]
concurrency = "bbq_concurrency:module"

[tool.uv.sources]
bbq-core = { workspace = true }
bbq-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbq_concurrency"]
