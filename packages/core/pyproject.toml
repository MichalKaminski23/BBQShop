[project]
name = "bbq-core"
version = "0.1.0"
description = "Wspólne elementy BBQShop: konfiguracja, połączenia z bazami, kontrakt modułu."
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.10",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbq_core"]
