[project]
name = "bbq-path_traversal"
version = "0.1.0"
description = "Moduł BBQShop: Path traversal (wersja podatna i poprawiona)."
requires-python = ">=3.13"
dependencies = ["bbq-core", "bbq-db"]

[project.entry-points."bbqshop.modules"]
path_traversal = "bbq_path_traversal:module"

[tool.uv.sources]
bbq-core = { workspace = true }
bbq-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbq_path_traversal"]
