[project]
name = "bbq-cmdi"
version = "0.1.0"
description = "Moduł BBQShop: command injection w diagnostyce sieci (wersja podatna i poprawiona)."
requires-python = ">=3.13"
dependencies = ["bbq-core"]

[project.entry-points."bbqshop.modules"]
cmdi = "bbq_cmdi:module"

[tool.uv.sources]
bbq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbq_cmdi"]
