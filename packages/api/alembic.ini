# Uruchamianie z katalogu głównego repo:
#   uv run alembic -c packages/api/alembic.ini upgrade head
# Adres bazy pochodzi z BBQ_POSTGRES_DSN (patrz bbq_api/migrations/env.py).

[alembic]
script_location = bbq_api:migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
