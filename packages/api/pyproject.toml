[project]
name = "bbq-api"
version = "0.1.0"
description = "Aplikacja FastAPI składająca moduły podatności BBQShop."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "bbq-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
bbq-api = "bbq_api.__main__:main"

[tool.uv.sources]
bbq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbq_api"]
