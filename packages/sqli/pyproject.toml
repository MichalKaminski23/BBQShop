[project]
name = "bbq-sqli"
version = "0.1.0"
description = "Moduł BBQShop: SQL Injection w wyszukiwarce produktów (wersja podatna i poprawiona)."
requires-python = ">=3.13"
dependencies = ["bbq-core"]

[project.entry-points."bbqshop.modules"]
sqli = "bbq_sqli:module"

[tool.uv.sources]
bbq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbq_sqli"]
