[project]
name = "bbq-race"
version = "0.1.0"
description = "Moduł BBQShop: race condition przy wykorzystaniu kuponu."
requires-python = ">=3.13"
dependencies = ["bbq-core", "bbq-db", "sqlalchemy>=2.0"]

[project.entry-points."bbqshop.modules"]
race = "bbq_race:module"

[tool.uv.sources]
bbq-core = { workspace = true }
bbq-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbq_race"]
